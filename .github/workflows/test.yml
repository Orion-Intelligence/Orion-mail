name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the client dependencies
        run: |
          set -euo pipefail
          export npm_config_loglevel=error
          (cd client && npm ci)

      - name: Lint the client (eslint + stylelint) and the backend (pyflakes + bandit)
        run: |
          set -euo pipefail
          chmod +x ./run.sh
          ./run.sh lint

  client-tests:
    runs-on: ubuntu-latest
    env:
      HEALTH_TIMEOUT: 900
      ORION_E2E_BASE_URL: http://127.0.0.1:4300

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bash curl git ca-certificates gnupg jq openssl python3
          if ! command -v google-chrome >/dev/null 2>&1; then
            curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
            echo "deb [signed-by=/usr/share/keyrings/google.gpg arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends google-chrome-stable
          fi
          google-chrome --version

      - name: Write the CI environment file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 .github/scripts/write-ci-env.py
          test -s .env

      - name: Reset Docker state
        run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true

      - name: Create the shared Orion network
        run: |
          set -euo pipefail
          docker network inspect shared_bridge >/dev/null 2>&1 || docker network create shared_bridge
          docker network inspect shared_bridge --format 'shared_bridge ready ({{.Driver}})'

      - name: Build the instrumented client and start the stack
        run: |
          set -euo pipefail
          export npm_config_loglevel=error
          export NODE_OPTIONS=--no-deprecation
          chmod +x ./run.sh
          ./run.sh build -t

      - name: Verify the instrumented client build
        run: |
          set -euo pipefail
          test -f client/build/index.html
          if ! grep -q '__coverage__' client/build/main.js; then
            echo "FAIL: client/build/main.js is not instrumented"
            exit 1
          fi
          echo "SUCCESS: client build is instrumented"

      - name: Serve the instrumented client
        run: |
          set -euo pipefail
          cd client
          nohup node scripts/serve-build.mjs >../serve-build.log 2>&1 &
          echo $! >../serve-build.pid

      - name: Wait for the test service
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            api_code="$(curl -s --connect-timeout 2 --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/health" || true)"
            client_code="$(curl -s --connect-timeout 2 --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:4300/" || true)"
            echo "readiness attempt $i/120: API HTTP ${api_code:-000}, client HTTP ${client_code:-000}"
            if [ "$api_code" = "200" ] && [ "$client_code" = "200" ]; then
              exit 0
            fi
            if [ $((i % 12)) -eq 0 ]; then
              docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
              docker compose -p orion-mail -f docker-compose.yml logs --since 70s --tail=200 web mongo || true
              cat serve-build.log || true
            fi
            sleep 5
          done
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          docker compose -p orion-mail -f docker-compose.yml logs --tail=1000 || true
          cat serve-build.log || true
          exit 1

      - name: Run client tests with coverage
        run: |
          set -euo pipefail
          cd client
          export npm_config_loglevel=error
          export NODE_OPTIONS=--no-deprecation
          mkdir -p coverage cypress/downloads cypress/error cypress/screenshots cypress/videos
          rm -rf .nyc_output
          npx cypress verify
          ORION_COVERAGE=true npx cypress run --e2e --browser chrome
          test -s coverage/lcov.info

      - name: Capture client diagnostics on failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p client/cypress/diagnostics
          free -h >client/cypress/diagnostics/memory.txt || true
          df -h >client/cypress/diagnostics/disk.txt || true
          docker stats --no-stream >client/cypress/diagnostics/docker-stats.txt || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' >client/cypress/diagnostics/docker-containers.txt || true
          cp serve-build.log client/cypress/diagnostics/serve-build.log || true
          docker compose -p orion-mail -f docker-compose.yml logs --no-color web >client/cypress/diagnostics/web.log 2>&1 || true
          docker compose -p orion-mail -f docker-compose.yml logs --no-color mongo >client/cypress/diagnostics/mongo.log 2>&1 || true
          docker compose -p orion-mail -f docker-compose.yml logs --no-color clamav >client/cypress/diagnostics/clamav.log 2>&1 || true
          docker compose -p orion-mail -f docker-compose.yml logs --no-color rspamd >client/cypress/diagnostics/rspamd.log 2>&1 || true

      - name: Detect client artifacts
        if: always()
        id: client_artifacts
        run: |
          set -euo pipefail
          has_cypress=false
          has_coverage=false

          if find client/cypress/diagnostics client/cypress/downloads client/cypress/error client/cypress/screenshots client/cypress/videos -type f 2>/dev/null | grep -q .; then
            has_cypress=true
          fi

          if [ -s client/coverage/lcov.info ]; then
            has_coverage=true
          fi

          {
            echo "has_cypress=${has_cypress}"
            echo "has_coverage=${has_coverage}"
          } >> "$GITHUB_OUTPUT"

      - if: always() && steps.client_artifacts.outputs.has_cypress == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-artifacts
          path: |
            client/cypress/diagnostics/
            client/cypress/downloads/
            client/cypress/error/
            client/cypress/screenshots/
            client/cypress/videos/
          if-no-files-found: ignore
          retention-days: 7

      - if: always() && steps.client_artifacts.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-coverage
          path: client/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Show client service logs on failure
        if: failure()
        run: |
          free -h || true
          df -h || true
          docker stats --no-stream || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          docker compose -p orion-mail -f docker-compose.yml logs --tail=1000 || true

      - if: always()
        run: |
          set -euo pipefail
          if [ -f serve-build.pid ]; then kill "$(cat serve-build.pid)" || true; fi
          ./run.sh stop || true
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true

  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements.txt

      - name: Run backend tests with coverage
        run: |
          set -euo pipefail
          chmod +x ./run.sh
          ./run.sh test -c

      - name: Verify the backend coverage report
        run: |
          set -euo pipefail
          test -s backend/coverage.xml

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  coverage-report:
    runs-on: ubuntu-latest
    needs: [client-tests, backend-tests]
    if: needs.client-tests.result == 'success' && needs.backend-tests.result == 'success'
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download client coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-coverage
          path: client/coverage

      - name: Download backend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage
          path: backend

      - name: Normalize coverage paths to the repository root
        run: |
          set -euo pipefail
          test -s client/coverage/lcov.info
          test -s backend/coverage.xml
          python3 .github/scripts/normalize-coverage.py
          grep -m1 '^SF:' client/coverage/lcov.info
          grep -m1 -o 'filename="[^"]*"' backend/coverage.xml

      - name: Detect coverage reports
        id: codacy_reports
        run: |
          set -euo pipefail
          test -s client/coverage/lcov.info
          test -s backend/coverage.xml
          echo "reports=client/coverage/lcov.info,backend/coverage.xml" >> "$GITHUB_OUTPUT"

      - name: Upload combined coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != '' && steps.codacy_reports.outputs.reports != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.codacy_reports.outputs.reports }}

      - name: Skip the Codacy upload
        if: env.CODACY_PROJECT_TOKEN == ''
        run: echo "CODACY_PROJECT_TOKEN is not available for this run; skipping the Codacy coverage upload."

      - name: Build merged coverage summary (client + backend)
        run: |
          set -euo pipefail
          python3 .github/scripts/merge-coverage.py

      - name: Detect merged coverage artifacts
        id: coverage_artifacts
        run: |
          set -euo pipefail
          has_coverage=false
          if [ -s coverage-merged/coverage-summary.json ] || [ -s coverage-merged/coverage-summary.md ]; then
            has_coverage=true
          fi
          echo "has_coverage=${has_coverage}" >> "$GITHUB_OUTPUT"

      - if: steps.coverage_artifacts.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-artifacts
          path: |
            backend/coverage.xml
            client/coverage/lcov.info
            coverage-merged/coverage-summary.json
            coverage-merged/coverage-summary.md
          if-no-files-found: ignore
          retention-days: 7
