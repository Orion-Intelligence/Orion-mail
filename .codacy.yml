---
exclude_paths:
  - "client/build/**"
  - "client/coverage/**"
  - "client/.angular/**"
  - "client/node_modules/**"
  - "client/.nyc_output/**"
  - "client/src/assets/**"
  - "client/*.config.*"
  - "client/cypress/**"
  - "README.md"
  - "run.sh"
  - "**/*.html"
  - "**/*.md"
  - "**/*.sh"
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.json"
  - "**/*.map"
  - "**/__init__.py"
  - "**/eslint.config.js"
  - "coverage/**"
  - ".nyc_output/**"
  - "backend/tests/**"
  - "backend/static/**"
  - "dockerFiles/**"
  - "nginx/**"
  - "rspamd/**"
  - "clamav/**"

engines:
  metric:
    config:
      languages:
        - "python"
        - "typescript"
        - "javascript"
  duplication:
    exclude_paths:
      - "client/build/**"
      - "client/coverage/**"
      - "client/.angular/**"
      - "client/node_modules/**"
      - "client/.nyc_output/**"
      - "client/src/assets/**"
      - "client/*.config.*"
      - "client/cypress/**"
      - "README.md"
      - "run.sh"
      - "**/*.html"
      - "**/__init__.py"
      - "**/eslint.config.js"
      - "coverage/**"
      - ".nyc_output/**"
      - "backend/tests/**"
      - "backend/static/**"
