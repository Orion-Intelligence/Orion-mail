services:
  web:
    container_name: orion-mail-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockerFiles/api_docker
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}@mongo:27017/?authSource=admin
      MONGODB_DATABASE: ${MONGODB_DATABASE:-orion_mail}
      ATTACHMENT_STORAGE_DIR: /app/static/resource/attachments
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-mail.orionintelligence.org,localhost,127.0.0.1},web
      SMTP_HOST: postfix
      SMTP_PORT: ${SMTP_PORT:-25}
      RSPAMD_CONTROLLER_URL: http://rspamd:11334
      RSPAMD_CONTROLLER_PASSWORD: ${RSPAMD_CONTROLLER_PASSWORD:?RSPAMD_CONTROLLER_PASSWORD must be set}
      SEED_LOCAL_TEST_MAILBOXES: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://mail.orionintelligence.org}
      COOKIE_SECURE: "true"
      HOME: /tmp
    working_dir: /app
    depends_on:
      mongo:
        condition: service_healthy
      clamav:
        condition: service_healthy
      rspamd:
        condition: service_started
    volumes:
      - ./backend/static/resource/attachments:/app/static/resource/attachments:rw
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend
      - shared_bridge
    healthcheck:
      test: [ "CMD", "python3", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: >
      sh -c "python3 /app/cronjobs.py & exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips='*'"

  postfix:
    container_name: orion-mail-postfix
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockerFiles/postfix_docker
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-mail.orionintelligence.org}
      ORION_MAIL_INCOMING_URL: http://web:8000/incoming-mail/
      ORION_MAIL_INCOMING_TOKEN: ${INCOMING_MAIL_TOKEN:?INCOMING_MAIL_TOKEN must be set}
      POSTFIX_MYNETWORKS: 127.0.0.0/8 172.16.0.0/12
      POSTFIX_MILTER: inet:rspamd:11332
      POSTFIX_MESSAGE_SIZE_LIMIT: "67108864"
    depends_on:
      web:
        condition: service_started
      rspamd:
        condition: service_started
    ports:
      - "25:25"
    volumes:
      - postfix:/var/spool/postfix
    read_only: true
    tmpfs:
      - /etc/postfix:rw,nosuid,nodev,size=8m,mode=755
      - /var/lib/postfix:rw,nosuid,nodev,size=16m,mode=755
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 25), 5).close()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    container_name: orion-mail-nginx
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:44e36330f74d4f3a1d4e222acca9e23b401fb87811a7597024502bb759c4dd49
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx:/etc/nginx/orion:ro
      - ./backend/static:/app/static:ro
      - ./client/build:/client_build:ro
      - letsencrypt-webroot:/var/www/letsencrypt:ro
      - tls-certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      backend:
      shared_bridge:
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    profiles:
      - certbot
    container_name: orion-mail-certbot
    image: certbot/certbot:latest@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    security_opt:
      - no-new-privileges:true
    volumes:
      - letsencrypt-webroot:/var/www/letsencrypt:rw
      - tls-certs:/certs:rw
      - /etc/letsencrypt:/etc/letsencrypt:rw
    networks:
      backend:

  mongo:
    container_name: orion-mail-mongodb
    image: mongo:7.0@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo:/data/db
    command: [ "mongod", "--auth", "--bind_ip_all" ]
    networks:
      backend:
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  rspamd:
    container_name: orion-mail-rspamd
    image: rspamd/rspamd:3.11.1@sha256:116c2e05bb03073f5ff3b41f407fb5f9ac13ae726e8f8d0cd56231e97d49d7b7
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
      - rspamd:/var/lib/rspamd
    ports:
      - "127.0.0.1:${RSPAMD_MILTER_PORT:-11332}:11332"
      - "127.0.0.1:${RSPAMD_UI_PORT:-11334}:11334"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "rspamadm control stat > /dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  clamav:
    container_name: orion-mail-clamav
    image: clamav/clamav:1.4@sha256:c3bfbf2a2c9abc1fc179e63832a9e8bfac901ede83853e3fa10acf6f1fb5c803
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
      FRESHCLAM_CHECKS: "${FRESHCLAM_CHECKS:-2}"
    volumes:
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "echo PING | nc -w 3 127.0.0.1 3310 | grep -q PONG" ]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 180s

  redis:
    container_name: orion-mail-redis
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: [ "redis-server", "--save", "60", "1", "--appendonly", "no" ]
    volumes:
      - redis:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

networks:
  backend:
    driver: bridge
  shared_bridge:
    external: true

volumes:
  mongo:
  postfix:
  rspamd:
  clamav:
  redis:
  letsencrypt-webroot:
  tls-certs:
