<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Orion Mail</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf4fb" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preload" as="image" href="/assets/images/orion-mail-backdrop.webp" />
    <script src="/assets/scripts/initialize-theme.js"></script>
    <style nonce="__CSP_NONCE__">
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #edf4fb;
        opacity: 1;
        will-change: opacity;
        transition: opacity 240ms ease-out;
      }

      html.dark-theme #app-splash {
        background: #090b0f;
      }

      #app-splash .app-splash-logo {
        width: 200px;
        height: auto;
        animation: app-splash-breathe 1700ms ease-in-out infinite;
      }

      #app-splash .app-splash-logo-dark {
        display: none;
      }

      html.dark-theme #app-splash .app-splash-logo-light {
        display: none;
      }

      html.dark-theme #app-splash .app-splash-logo-dark {
        display: block;
      }

      #app-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      @keyframes app-splash-breathe {
        0%,
        100% {
          opacity: 0.55;
        }

        50% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash .app-splash-logo {
          animation: none;
          opacity: 1;
        }

        #app-splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-page text-ink antialiased">
    <div id="app-splash" aria-hidden="true">
      <!--__SPLASH_LOGO__-->
    </div>
    <app-root ngCspNonce="__CSP_NONCE__"></app-root>
  </body>
</html>
