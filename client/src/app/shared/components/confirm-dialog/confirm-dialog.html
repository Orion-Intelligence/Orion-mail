@if (open) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/45 px-4" role="presentation" (click)="close()">

    <section role="dialog" aria-modal="true" class="w-full max-w-md rounded-2xl border border-line-soft bg-surface p-5 shadow-xl" (click)="$event.stopPropagation()">

        <header class="flex items-start justify-between gap-3">
            <h2 class="text-lg font-semibold text-ink">{{ title }}</h2>

            <button type="button" aria-label="Close" (click)="close()" [disabled]="busy" class="flex h-8 w-8 cursor-pointer items-center justify-center rounded-full border-none bg-transparent text-muted hover:bg-hover-soft disabled:cursor-wait disabled:opacity-55">
                ×
            </button>
        </header>

        @if (message) {
        <p class="mt-2 text-sm leading-6 text-muted">{{ message }}</p>
        }

        <ng-container>
            <ng-content select="[confirm-body]"></ng-content>
        </ng-container>

        @if (defaultActions) {
        <div class="mt-5 flex justify-end gap-2">
            <button type="button" (click)="close()" [disabled]="busy" data-testid="confirm-dialog-cancel" class="h-10 cursor-pointer rounded-full border-none bg-transparent px-4 text-sm font-medium text-primary hover:enabled:bg-primary-soft disabled:cursor-wait disabled:opacity-55">
                {{ cancelText }}
            </button>

            <button type="button" (click)="confirm()" [disabled]="busy" data-testid="confirm-dialog-confirm" class="h-10 cursor-pointer rounded-full border-none px-5 text-sm font-medium disabled:cursor-wait disabled:opacity-55" [class.bg-danger-soft]="destructive" [class.text-danger]="destructive" [class.bg-primary-solid]="!destructive" [class.text-on-primary]="!destructive">
                {{ busy ? 'Please wait…' : confirmText }}
            </button>
        </div>
        } @else {
        <ng-container>
            <ng-content select="[confirm-actions]"></ng-content>
        </ng-container>
        }
    </section>
</div>
}
