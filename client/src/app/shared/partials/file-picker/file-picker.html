<div class="fixed inset-0 z-[200] flex items-center justify-center bg-black/45 p-4" (click)="close()">
    <div class="flex max-h-[80dvh] w-full max-w-xl flex-col overflow-hidden rounded-2xl border border-line bg-surface shadow-2xl" (click)="$event.stopPropagation()">
        <div class="flex items-center justify-between border-b border-row-line px-5 py-4">
            <div>
                <h2 class="text-base font-semibold text-ink">
                    Orion Files
                </h2>

                <p class="mt-0.5 text-xs text-muted">
                    Files are encrypted in your browser before upload.
                </p>
            </div>

            <button type="button" (click)="close()" class="flex h-8 w-8 items-center justify-center rounded-full text-muted hover:bg-hover-soft">
                ✕
            </button>
        </div>

        <div class="border-b border-row-line p-4">
            <label class="flex h-10 cursor-pointer items-center justify-center rounded-full bg-primary-solid px-5 text-sm font-medium text-on-primary hover:bg-primary-solid-hover">
                {{ uploading() ? 'Uploading…' : 'Upload New' }}

                <input type="file" multiple class="sr-only" [disabled]="uploading()" (change)="uploadSelected($event)" />
            </label>
        </div>

        @if (error()) {
        <div class="mx-4 mt-3 rounded-lg bg-danger-soft px-3 py-2 text-xs text-danger">
            {{ error() }}
        </div>
        }

        <div class="min-h-44 flex-1 overflow-y-auto p-4">
            <p class="mb-3 text-xs font-semibold uppercase text-muted">
                My Files
            </p>

            @if (files().length === 0) {
            <p class="py-8 text-center text-sm text-muted">
                No files uploaded yet.
            </p>
            }

            @for (file of files(); track file.id) {
            <div class="mb-2 flex items-center gap-3 rounded-xl border border-line px-3 py-3">
                <div class="min-w-0 flex-1">
                    <p class="truncate text-sm font-medium text-ink" [title]="file.original_filename">
                        {{ file.original_filename }}
                    </p>

                    <p class="text-xs text-muted">
                        {{ formatSize(file.original_size) }}
                    </p>
                </div>

                <button type="button" [disabled]="!canInsert(file)" (click)="insertExisting(file)" class="h-8 rounded-full border border-line px-3 text-xs font-medium text-primary hover:bg-primary-soft disabled:cursor-not-allowed disabled:opacity-40">
                    Insert
                </button>
            </div>
            }
        </div>
    </div>
</div>
