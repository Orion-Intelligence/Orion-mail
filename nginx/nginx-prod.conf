pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    autoindex off;
    sendfile on;
    tcp_nopush on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 ipv6=off valid=300s;
    resolver_timeout 10s;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    map $request_uri $bad_traversal {
        default 0;
        ~*"\.\./" 1;
        ~*"%2e%2e/" 1;
        ~*"\.%2e/" 1;
        ~*"%2e\./" 1;
        ~*"%2f\.\.%2f" 1;
        ~*"%5c\.\.%5c" 1;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 120s;
    client_body_buffer_size 8m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    keepalive_timeout 65s;

    server {
        listen 8080 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 444;
        }
    }

    server {
        listen 8080;
        server_name mail.orionintelligence.org;
        client_max_body_size 32m;
        limit_conn conn_limit 50;
        set $app_backend orion-mail-web:8000;

        if ($bad_traversal) { return 403; }

        include /etc/nginx/orion/security-headers.conf;

        error_page 502 503 504 =503 /maintenance.html;

        location ~ /\.(?!well-known/) {
            deny all;
        }

        location ^~ /incoming-mail {
            return 404;
        }

        location ~ ^/(auth|messages|labels|mailboxes|address-book|attachments|system-config|health)(/|$) {
            if (-f /app/static/.maintenance) { return 503; }
            limit_req zone=api_limit burst=40 nodelay;
            include /etc/nginx/orion/proxy-params.conf;
        }

        location ~* "^/(?:[^/]+-[a-z0-9]{8}\.(?:js|mjs|css|map)|media/.+)$" {
            root /client_build;
            try_files $uri =404;
            access_log off;
            include /etc/nginx/orion/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location = /maintenance.html {
            root /app/static;
            internal;
            include /etc/nginx/orion/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Retry-After "60" always;
        }

        location / {
            if (-f /app/static/.maintenance) { return 503; }
            root /client_build;
            try_files $uri /index.html;
            sub_filter_once off;
            sub_filter '__CSP_NONCE__' $request_id;
            include /etc/nginx/orion/security-headers.conf;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
    }
}
